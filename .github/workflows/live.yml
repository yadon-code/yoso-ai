# 毎日の自動予想（エア投票）と Discord 通知。
# GitHubの1回の実行は6時間までなので、1日を3回に分けて動かす。
# 時刻はUTCで書く（日本時間 = UTC + 9時間）。
name: 毎日の自動予想

on:
  schedule:
    - cron: "20 22 * * *"   # 朝の部   7:20 JST（GitHubは30分ほど遅れて始まることがある） 〜 12:30 締切まで
    - cron: "50 2 * * *"    # 昼の部  11:50 JST（朝の部が終わるまで待ってから始まる） 〜 17:30 締切まで
    - cron: "50 7 * * *"    # 夜の部  16:50 JST（昼の部が終わるまで待ってから始まる） 〜 最終レース＋1日のまとめ
  workflow_dispatch:
    inputs:
      mode:
        description: "test=テスト通知だけ / once=今の時点で締切前のレースを1回だけ予想 / live=通常どおり"
        default: test

concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # 朝・昼の部が終わったら、すぐ次の部を始めるため

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}   # ウェブアプリと記録の金庫の合言葉（未設定ならカギなしで、前と同じく記録をそのまま main に保存）
      RECORDS_MODE: vault   # legacy にすると、記録を前と同じく10分ごとに main にもそのまま保存する（もとに戻すとき用）
      TZ: Asia/Tokyo
    steps:
      # 回の開始時刻を覚えておく。予想は「開始＋5時間20分」（src/live_plan.py の RUN_LIMIT_MIN）までに切り上げて、
      # timeout-minutes（355分）で強制終了される前に次の回へ渡す
      - name: 開始時刻を記録
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # 前の回が終わるのを待ってから始まることがあるので、予約した時点ではなく「始まった時点」の最新を使う
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: テスト通知
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python src/notify.py "✅ 予想AIの通知テストです。これが届いていれば設定OK！"

      - name: 過去データを復元
        id: data_restore
        if: github.event_name == 'schedule' || inputs.mode != 'test'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/csv
            data/cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: 初回だけ過去データを展開
        id: data_ready   # 成功したら data/raw・data/csv がそろっている（キャッシュから戻したか、seed から作った）
        if: github.event_name == 'schedule' || inputs.mode != 'test'
        run: |
          if [ ! -d data/raw/K ]; then unzip -q seed/raw.zip -d data/; fi
          if [ ! -f data/csv/programs.csv ]; then python src/parse.py; fi
          ls data/raw/K | tail -1

      # 予想・エア投票などの記録を、キャッシュ（data/cache/records）・site-data ブランチ・main の金庫のうち新しいものから戻す。
      # 戻せないとき（合言葉が変わった など）は、空から始めて記録を上書きしないよう、ここで止める。
      - name: 予想とエア投票の記録を戻す
        id: records
        if: github.event_name == 'schedule' || inputs.mode != 'test'
        run: python src/records.py restore

      - name: 予想する
        if: github.event_name == 'schedule' || inputs.mode != 'test'
        run: |
          git config user.name "yoso-ai bot"
          git config user.email "yoso-ai-bot@users.noreply.github.com"
          # 10分ごとにウェブアプリ用のデータを保存する（裏で動かす）
          ( while sleep 600; do bash scripts/push_data.sh; done ) &
          LOOP=$!
          trap 'kill $LOOP 2>/dev/null || true' EXIT   # 予想が途中で落ちても、10分ごとの保存を止める（最後の保存は下の手順で）
          # 予約時刻はGitHubの都合で何時間も遅れることがあるので、時刻ではなく「始まった時点の時刻」で部を決める
          # （11:30 前＝朝の部 12:30 まで、16:30 前＝昼の部 17:30 まで、それ以降＝夜の部。src/live_plan.py）。
          # どの回も「部の終わり」と「開始＋5時間20分」の早いほうで切り上げ、レースが残っていれば
          # 印のファイル（HANDOFF）ができるので、次の回を自分で呼ぶ（予約はその予備）。
          # 夜中に始まった回は、上限まで待ってから次を呼ぶ（回を連打しない）。
          HANDOFF="$RUNNER_TEMP/live-handoff"
          rm -f "$HANDOFF"
          if [ "${{ inputs.mode }}" = "once" ]; then
            python src/live.py --once
          else
            python src/live.py --auto --job-start "${JOB_START:-$(date +%s)}" --handoff-file "$HANDOFF"
          fi
          if [ -f "$HANDOFF" ]; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/live.yml/dispatches -f ref=main -f 'inputs[mode]=live' \
              && echo "次の回を呼びました"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 止まったら知らせる
        if: ${{ !success() && (github.event_name == 'schedule' || inputs.mode != 'test') }}
        run: |
          if [ -f "$(git rev-parse --git-dir)/records-restore-locked" ]; then
            # 合言葉で記録の金庫を開けなかったときは、直るまで毎回止まるので、合言葉を確かめてもらう
            python src/notify.py "⚠️ 自動予想を止めました。予想とエア投票の記録の金庫が、今の合言葉（GitHub の Secret「SITE_PASSWORD」）で開けません。合言葉を変えた・消したなら、元の合言葉に戻してください（記録を空で上書きしないよう、直るまで毎回ここで止まります）。くわしくは ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            python src/notify.py "⚠️ 自動予想が途中で止まりました。次の回（朝・昼・夜）でまた動きます。くわしくは ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi

      # 記録を戻せた回だけ保存する（準備で失敗した回・戻せなかった回に、足りない記録で上書きしないため）。
      # 予想の本体が途中で落ちた回も、戻せていれば保存する。
      - name: 予想とエア投票の記録をリポジトリに保存
        if: always() && (github.event_name == 'schedule' || inputs.mode != 'test') && steps.records.outcome == 'success'
        # 先に記録を保存してから、その写し（data/cache/records）ごとキャッシュに入れる
        run: |
          git config user.name "yoso-ai bot"
          git config user.email "yoso-ai-bot@users.noreply.github.com"
          bash scripts/push_data.sh final

      # 過去データがそろっていた回だけ保存する（準備で失敗した回に、data/raw・data/csv の無いものを最新として残さないため）
      - name: 過去データを保存
        if: always() && (github.event_name == 'schedule' || inputs.mode != 'test') && steps.data_ready.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/csv
            data/cache
          key: data-${{ github.run_id }}
