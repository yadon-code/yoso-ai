# 毎日の自動予想（エア投票）と Discord 通知。
# GitHubの1回の実行は6時間までなので、1日を3回に分けて動かす。
# 時刻はUTCで書く（日本時間 = UTC + 9時間）。
name: 毎日の自動予想

on:
  schedule:
    - cron: "20 22 * * *"   # 朝の部   7:20 JST（GitHubは30分ほど遅れて始まることがある） 〜 12:30 締切まで
    - cron: "50 2 * * *"    # 昼の部  11:50 JST（朝の部が終わるまで待ってから始まる） 〜 17:30 締切まで
    - cron: "50 7 * * *"    # 夜の部  16:50 JST（昼の部が終わるまで待ってから始まる） 〜 最終レース＋1日のまとめ
  workflow_dispatch:
    inputs:
      mode:
        description: "test=テスト通知だけ / once=今の時点で締切前のレースを1回だけ予想 / live=通常どおり"
        default: test

concurrency:
  group: live
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # 朝・昼の部が終わったら、すぐ次の部を始めるため

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}   # ウェブアプリの合言葉（未設定ならカギなし）
      TZ: Asia/Tokyo
    steps:
      # 前の回が終わるのを待ってから始まることがあるので、予約した時点ではなく「始まった時点」の最新を使う
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: テスト通知
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test'
        run: python src/notify.py "✅ 予想AIの通知テストです。これが届いていれば設定OK！"

      - name: 過去データを復元
        if: github.event_name == 'schedule' || inputs.mode != 'test'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/csv
            data/cache
          key: data-${{ github.run_id }}
          restore-keys: data-

      - name: 初回だけ過去データを展開
        if: github.event_name == 'schedule' || inputs.mode != 'test'
        run: |
          if [ ! -d data/raw/K ]; then unzip -q seed/raw.zip -d data/; fi
          if [ ! -f data/csv/programs.csv ]; then python src/parse.py; fi
          ls data/raw/K | tail -1

      - name: 予想する
        if: github.event_name == 'schedule' || inputs.mode != 'test'
        run: |
          git config user.name "yoso-ai bot"
          git config user.email "yoso-ai-bot@users.noreply.github.com"
          # 10分ごとにウェブアプリ用のデータを保存する（裏で動かす）
          ( while sleep 600; do bash scripts/push_data.sh; done ) &
          # 予約時刻はGitHubの都合で30〜40分遅れることがあるので、時刻ではなく「始まった時点の時刻」で部を決め、
          # 朝・昼の部は終わった瞬間に次の部を自分で呼ぶ（予約はその予備）
          HM=$(date +%H%M)
          if [ "${{ inputs.mode }}" = "once" ]; then
            python src/live.py --once
          elif [ "$HM" -lt 1130 ]; then
            python src/live.py --until 12:30; NEXT=1
          elif [ "$HM" -lt 1630 ]; then
            python src/live.py --until 17:30; NEXT=1
          else
            python src/live.py
          fi
          if [ "$NEXT" = 1 ]; then
            gh api -X POST repos/${{ github.repository }}/actions/workflows/live.yml/dispatches -f ref=main -f 'inputs[mode]=live' \
              && echo "次の部を呼びました"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 止まったら知らせる
        if: ${{ !success() && (github.event_name == 'schedule' || inputs.mode != 'test') }}
        run: python src/notify.py "⚠️ 自動予想が途中で止まりました。次の回（朝・昼・夜）でまた動きます。くわしくは ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: 過去データを保存
        if: always() && (github.event_name == 'schedule' || inputs.mode != 'test')
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/csv
            data/cache
          key: data-${{ github.run_id }}

      - name: 予想とエア投票の記録をリポジトリに保存
        if: always() && (github.event_name == 'schedule' || inputs.mode != 'test')
        run: |
          git config user.name "yoso-ai bot"
          git config user.email "yoso-ai-bot@users.noreply.github.com"
          bash scripts/push_data.sh final
