<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>競艇予想AI</title>
<meta name="description" content="競艇の3連単をAIで予想。レース場ごとの予想・買い目・結果と回収率。">
<style>
:root{--bg:#f6f5f2;--panel:#fff;--fg:#1d1d1b;--muted:#6b6a66;--line:#e4e2dc;--accent:#2f5bd3;--ok:#1f8a4c;--ng:#b23b3b;--chip:#ecebe6}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#211f1e;--fg:#ecebe6;--muted:#a3a19b;--line:#36332f;--accent:#7f9ef0;--ok:#4cc27e;--ng:#e07272;--chip:#2c2a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:16px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--muted)}.stat .v{font-size:22px;font-variant-numeric:tabular-nums;font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:8px 0 12px}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.toggle{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card.buy{border-color:var(--accent)}
.head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.title{font-weight:600;font-size:16px}.meta{color:var(--muted);font-size:13px}
.boats{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0 6px}
.boat{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-variant-numeric:tabular-nums}
.num{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid #0003}
.b1{background:#fff;color:#000}.b2{background:#222;color:#fff}.b3{background:#d33;color:#fff}.b4{background:#2a62d6;color:#fff}.b5{background:#f2cf2a;color:#000}.b6{background:#1f9a4e;color:#fff}
.bar{width:100%;height:36px;background:var(--chip);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.bar i{display:block;width:100%;background:var(--accent);opacity:.75}
.line{font-size:13px;margin-top:6px}.line b{font-weight:600}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pick{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums}
.pick.hit{border-color:var(--ok);color:var(--ok);font-weight:600}
.res{font-size:13px;margin-top:8px}.ok{color:var(--ok);font-weight:600}.ng{color:var(--muted)}
.empty{color:var(--muted);padding:24px 0;text-align:center}
.note{color:var(--muted);font-size:12px;margin-top:20px}
.lock{max-width:360px;margin:18vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.lock h2{font-size:18px;margin:0 0 4px}
.lock form{display:flex;gap:8px;margin-top:14px}
.lock input{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.lock button,.linkbtn{font:inherit;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 14px;cursor:pointer}
.linkbtn{background:none;border:none;color:var(--muted);padding:0;font-size:12px;text-decoration:underline}
.err{color:var(--ng);font-size:13px;min-height:1.5em;margin:8px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="lock" hidden>
  <div class="lock">
    <h2>競艇予想AI</h2>
    <p class="sub">このページを見るには合言葉が必要です。</p>
    <form id="lockForm">
      <input type="password" id="pw" placeholder="合言葉" aria-label="合言葉" autocomplete="current-password" required>
      <button type="submit">ひらく</button>
    </form>
    <p class="err" id="lockErr" role="alert"></p>
  </div>
</div>
<div class="wrap" id="app">
  <h1>競艇予想AI</h1>
  <p class="sub" id="updated">読み込み中…</p>

  <div class="stats" id="stats"></div>

  <div class="row">
    <select id="day" aria-label="日付"></select>
    <label class="toggle"><input type="checkbox" id="onlyBuy"> 買い目があるレースだけ</label>
  </div>
  <div class="chips" id="venues"></div>
  <div class="cards" id="cards"></div>

  <p class="note">予想は締切の少し前、展示を見たあとに出します。買い目は「AIの確率 × オッズ」が1を超えた組（期待値1超え、100倍以下）で、1点100円の想定です。お金は使わない「エア投票」の記録で、まだ勝てると証明されたものではありません。 <button class="linkbtn" id="relock" hidden>カギをかけ直す</button></p>
</div>
<script>
const BASE = 'https://raw.githubusercontent.com/yadon-code/yoso-ai/main/data/site/';
const S = { days: null, day: null, data: null, venue: 'all', onlyBuy: false };
const $ = (id) => document.getElementById(id);
const yen = (n) => n.toLocaleString('ja-JP') + '円';
const pct = (a, b) => b ? Math.round(a / b * 100) + '%' : '—';

// 合言葉のロック: データが暗号化されていれば（.enc）、合言葉から鍵を作って元に戻す。
// 合言葉はこの端末のブラウザにだけ覚えておく（次からは入力不要）。
const PW_KEY = 'yoso-ai-pw';
class LockedError extends Error {}
const savedPw = () => { try { return localStorage.getItem(PW_KEY); } catch (e) { return S.pw || null; } };
const savePw = (v) => { S.pw = v; try { v ? localStorage.setItem(PW_KEY, v) : localStorage.removeItem(PW_KEY); } catch (e) { /* 保存できなくても動く */ } };

async function decrypt(b64, pw) {
  const raw = Uint8Array.from(atob(b64.trim()), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: raw.slice(0, 16), iterations: 200000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(16, 28) }, key, raw.slice(28));
  return JSON.parse(new TextDecoder().decode(plain));
}

async function get(name) {
  const enc = await fetch(BASE + name + '.enc?t=' + Date.now());
  if (enc.ok) {
    const pw = S.pw || savedPw();
    if (!pw) throw new LockedError('');
    try { const d = await decrypt(await enc.text(), pw); S.locked = true; return d; }
    catch (e) { savePw(null); throw new LockedError('合言葉がちがいます'); }
  }
  const r = await fetch(BASE + name + '?t=' + Date.now());  // カギなしのデータ
  if (!r.ok) throw new Error(r.status);
  return r.json();
}

function showLock(msg) {
  $('app').hidden = true; $('lock').hidden = false;
  $('lockErr').textContent = msg || ''; $('pw').value = ''; $('pw').focus();
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function renderStats() {
  const t = S.days.total, d = S.days.days.find((x) => x.date === S.day) || { stake: 0, return: 0, hits: 0, settled: 0 };
  const items = [
    ['今日の回収率', pct(d.return, d.stake), `${yen(d.stake)} → ${yen(d.return)}`],
    ['今日の的中', `${d.hits} / ${d.settled}点`, ''],
    ['通算の回収率', pct(t.return, t.stake), `${yen(t.stake)} → ${yen(t.return)}`],
    ['通算の的中', `${t.hits} / ${t.settled}点`, ''],
  ];
  const box = $('stats'); box.replaceChildren();
  for (const [k, v, s] of items) {
    const c = el('div', 'stat'); c.append(el('div', 'k', k), el('div', 'v', v));
    if (s) c.append(el('div', 'k', s));
    box.append(c);
  }
}

function renderVenues() {
  const box = $('venues'); box.replaceChildren();
  const names = [...new Map(S.data.races.map((r) => [r.venue_code, r.venue])).entries()];
  const add = (code, label) => {
    const b = el('button', 'chip' + (S.venue === code ? ' on' : ''), label);
    b.onclick = () => { S.venue = code; renderVenues(); renderCards(); };
    box.append(b);
  };
  add('all', 'すべて');
  for (const [c, n] of names) add(c, n);
}

function renderCards() {
  const box = $('cards'); box.replaceChildren();
  let rs = S.data.races.filter((r) => S.venue === 'all' || r.venue_code === S.venue);
  if (S.onlyBuy) rs = rs.filter((r) => r.picks && r.picks.length && r.exhibit);
  rs.sort((a, b) => (a.deadline || a.predicted_at || '').localeCompare(b.deadline || b.predicted_at || '') || a.venue_code.localeCompare(b.venue_code));
  if (!rs.length) { box.append(el('div', 'empty', 'このレース場の予想はまだありません')); return; }
  for (const r of rs) {
    const buy = r.exhibit && r.picks && r.picks.length;
    const c = el('div', 'card' + (buy ? ' buy' : ''));
    const h = el('div', 'head');
    h.append(el('span', 'title', `${r.venue} ${r.race_no}R`),
      el('span', 'meta', [r.deadline ? `締切 ${r.deadline}` : '', r.predicted_at ? `予想 ${r.predicted_at}` : '予想前', r.exhibit === false ? '展示前の予想' : ''].filter(Boolean).join('・')));
    c.append(h);
    if (r.p_win) {
      const g = el('div', 'boats');
      const mx = Math.max(...r.p_win);
      r.p_win.forEach((p, i) => {
        const b = el('div', 'boat');
        const bar = el('div', 'bar'); const f = el('i'); f.style.height = Math.round(p / mx * 100) + '%'; bar.append(f);
        bar.setAttribute('role', 'img'); bar.setAttribute('aria-label', `${i + 1}号艇 1着確率 ${Math.round(p * 100)}%`);
        b.append(bar, el('span', 'num b' + (i + 1), i + 1), el('span', '', Math.round(p * 100) + '%'));
        g.append(b);
      });
      c.append(g);
      const top = el('div', 'line'); top.append(el('b', '', 'AIの本線 '), document.createTextNode(r.top5.slice(0, 3).map((t) => `${t.combo}（${(t.prob * 100).toFixed(1)}%）`).join('　')));
      c.append(top);
    }
    if (buy) {
      const l = el('div', 'line'); l.append(el('b', '', `買い目 ${r.picks.length}点（各100円）`)); c.append(l);
      const p = el('div', 'picks');
      for (const k of r.picks) p.append(el('span', 'pick' + (k.hit ? ' hit' : ''), `${k.combo}  ${k.odds}倍  期待値${k.ev.toFixed(2)}`));
      c.append(p);
    }
    if (r.result) {
      const res = el('div', 'res');
      res.append(document.createTextNode(`結果 ${r.result}（${yen(r.payout)}）　`));
      if (buy) {
        const hit = r.picks.find((k) => k.hit);
        res.append(hit ? el('span', 'ok', `的中 +${yen(r.payout)}`) : el('span', 'ng', 'はずれ'));
      }
      c.append(res);
    }
    box.append(c);
  }
}

async function loadDay(day) {
  S.day = day;
  S.data = await get(day.replaceAll('-', '') + '.json');
  if (S.venue !== 'all' && !S.data.races.some((r) => r.venue_code === S.venue)) S.venue = 'all';
  $('updated').textContent = `${day} のデータ（${S.data.updated} 更新）`;
  renderStats(); renderVenues(); renderCards();
}

async function init(keep) {
  try {
    S.days = await get('days.json');
    const sel = $('day'); const cur = keep && S.day;
    sel.replaceChildren();
    for (const d of S.days.days) { const o = el('option', '', d.date); o.value = d.date; sel.append(o); }
    if (!S.days.days.length) { $('updated').textContent = 'まだデータがありません'; return; }
    const day = cur && S.days.days.some((d) => d.date === cur) ? cur : S.days.days[0].date;
    sel.value = day;
    await loadDay(day);
    $('lock').hidden = true; $('app').hidden = false; $('relock').hidden = !S.locked;
  } catch (e) {
    if (e instanceof LockedError) showLock(e.message);
    else $('updated').textContent = 'データを読み込めませんでした';
  }
}

$('day').onchange = (e) => loadDay(e.target.value).catch((err) => { if (err instanceof LockedError) showLock(err.message); });
$('lockForm').onsubmit = (e) => { e.preventDefault(); savePw($('pw').value); $('lockErr').textContent = '確認中…'; init(false); };
$('relock').onclick = () => { savePw(null); showLock(''); };
$('onlyBuy').onchange = (e) => { S.onlyBuy = e.target.checked; renderCards(); };
init(false);
setInterval(() => { if ($('lock').hidden) init(true); }, 120000);
</script>
</body>
</html>
